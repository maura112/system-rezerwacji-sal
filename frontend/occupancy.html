<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zajętość sal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .back {
            background: white;
            color: #222;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 5px;
            font-size: 13px;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .reservation {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #c00;
        }

        .reservation h3 {
            margin-top: 0;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>

    <h1>🏫 System rezerwacji sal</h1>

    <a class="back" href="/dashboard">
        ← Panel główny
    </a>

</header>

<main>

    <h2>🔴 Zajętość sal</h2>

    <div id="reservations">
        Ładowanie...
    </div>

</main>

<script>

async function loadReservations() {

    const response = await fetch("/all-reservations");

    const reservations = await response.json();

    const container = document.getElementById("reservations");

    if (reservations.length === 0) {

        container.innerHTML = `
            <div class="empty">
                🟢 Aktualnie nie ma żadnych zaplanowanych rezerwacji.
            </div>
        `;

        return;
    }

    container.innerHTML = "";

    reservations.forEach(reservation => {

        container.innerHTML += `
            <div class="reservation">

                <h3>
                    🏫 Sala ${reservation.room}
                </h3>

                <p>
                    <strong>Budynek:</strong>
                    ${reservation.building}
                </p>

                <p>
                    <strong>Data:</strong>
                    ${reservation.date}
                </p>

                <p>
                    <strong>Godziny:</strong>
                    ${reservation.start_time}
                    –
                    ${reservation.end_time}
                </p>

            </div>
        `;

    });
}

loadReservations();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rezerwacja sali</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .back {
            background: white;
            color: #222;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        main {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .room-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .submit {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .submit:hover {
            background: #444;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>

    <h1>🏫 System rezerwacji sal</h1>

    <button class="back" onclick="window.location.href='/rooms-page'">
        ← Dostępne sale
    </button>

</header>


<main>

    <div class="card">

        <h2>📅 Rezerwacja sali</h2>

        <div class="room-info">
            <strong id="roomName">Ładowanie...</strong>
        </div>

        <form id="reservationForm">

            <label for="date">Data</label>
            <input
                type="date"
                id="date"
                required
            >

            <label for="start_time">Godzina rozpoczęcia</label>
            <input
                type="time"
                id="start_time"
                required
            >

            <label for="end_time">Godzina zakończenia</label>
            <input
                type="time"
                id="end_time"
                required
            >

            <button class="submit" type="submit">
                Potwierdź rezerwację
            </button>

        </form>

        <div id="message"></div>

    </div>

</main>


<script>

const params = new URLSearchParams(window.location.search);

const roomId = params.get("room_id");


async function loadRoom() {

    const response = await fetch("/rooms");

    const rooms = await response.json();

    const room = rooms.find(r => r.id == roomId);

    if (!room) {

        document.getElementById("roomName").textContent =
            "Nie znaleziono sali";

        return;
    }

    document.getElementById("roomName").textContent =
        `Sala ${room.name} — ${room.building}`;
}


document
    .getElementById("reservationForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const date = document.getElementById("date").value;
        const start_time = document.getElementById("start_time").value;
        const end_time = document.getElementById("end_time").value;

        const response = await fetch("/reservations", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                room_id: Number(roomId),
                date: date,
                start_time: start_time,
                end_time: end_time
            })
        });


        const data = await response.json();

        const message = document.getElementById("message");

        if (response.ok) {

            message.style.color = "green";

            message.textContent =
                "Rezerwacja zakończona sukcesem! 🎉";

        } else {

            message.style.color = "red";

            message.textContent = data.error;
        }

    });


loadRoom();

</script>

</body>

</html>
